name: require-owner-approval

# Defense in depth beside the documented branch-protection ruleset: fail a PR
# that lacks an approving review from a repository admin on the current head
# commit, unless an admin authored it. Trust is permission-based (admin), not
# the broad MEMBER association, and only approvals on the head commit count, so
# new commits re-arm the gate.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an admin approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          perm_of() {
            local permission
            if ! permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq '.permission'); then
              echo "::error::Could not fetch repository permission for $1." >&2
              return 1
            fi
            case "$permission" in
              admin|write|read|none) printf '%s\n' "$permission" ;;
              *)
                echo "::error::Invalid repository permission for $1." >&2
                return 1
                ;;
            esac
          }
          author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
          if ! author_perm=$(perm_of "$author"); then
            exit 1
          fi
          echo "PR author: $author ($author_perm)"
          if [ "$author_perm" = "admin" ]; then
            echo "PR satisfies the admin-author exemption."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if ! approvers=$(HEAD_SHA="$head" gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.state=="APPROVED") | select(.commit_id==env.HEAD_SHA) | .user.login] | unique | .[]'); then
            echo "::error::Could not fetch complete review history."
            exit 1
          fi
          for u in $approvers; do
            if ! reviewer_perm=$(perm_of "$u"); then
              exit 1
            fi
            if [ "$reviewer_perm" = "admin" ]; then
              echo "Approved on the current head commit by an admin ($u)."
              exit 0
            fi
          done
          echo "::error::This PR needs an approving review on the latest commit from a repository admin before it can merge."
          exit 1
